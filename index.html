<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Text</title>
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const text = params.get('text');
        if (text) {
            document.body.textContent = text;
        }
    </script>
</body>
</html>
